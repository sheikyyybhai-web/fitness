<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Obsidian Facet Armor Shield Gradient -->
    <linearGradient id="fmObsidianBg" x1="4" y1="2" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="50%" stop-color="#0E0E10"/>
      <stop offset="100%" stop-color="#050506"/>
    </linearGradient>

    <!-- Titanium Metallic Outer Rim Gradient -->
    <linearGradient id="fmTitaniumRim" x1="4" y1="2" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E4E4E7"/>
      <stop offset="25%" stop-color="#A7ADA8"/>
      <stop offset="60%" stop-color="#52525B"/>
      <stop offset="100%" stop-color="#27272A"/>
    </linearGradient>

    <!-- Titanium Steel Inset Gradient -->
    <linearGradient id="fmSteelGrad" x1="10" y1="10" x2="26" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#D4D4D8"/>
      <stop offset="100%" stop-color="#A1A1AA"/>
    </linearGradient>

    <!-- Crimson Kinetic Power Gradient -->
    <linearGradient id="fmCrimsonEnergy" x1="20" y1="12" x2="38" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF453A"/>
      <stop offset="50%" stop-color="#E11D32"/>
      <stop offset="80%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>

    <!-- Drop Glow for Crimson Core -->
    <filter id="fmCoreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#E11D32" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 1. Obsidian Armor Shield Plate -->
  <polygon points="24,2 43,9.5 43,28.5 24,46 5,28.5 5,9.5" fill="url(#fmObsidianBg)"/>
  
  <!-- 2. Titanium Chiseled Bevel Perimeter -->
  <polygon points="24,2 43,9.5 43,28.5 24,46 5,28.5 5,9.5" stroke="url(#fmTitaniumRim)" stroke-width="1.8" stroke-linejoin="round"/>
  
  <!-- 3. Inner Precision Calibrated Recess -->
  <polygon points="24,5 40,11.2 40,27 24,42.5 8,27 8,11.2" stroke="#2D2D30" stroke-width="0.8" fill="none"/>

  <!-- 4. Precision Metric Caliper Marks -->
  <line x1="24" y1="5.5" x2="24" y2="8" stroke="#A7ADA8" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="8" y1="19" x2="10.5" y2="19" stroke="#A7ADA8" stroke-width="1" stroke-linecap="round"/>
  <line x1="37.5" y1="19" x2="40" y2="19" stroke="#A7ADA8" stroke-width="1" stroke-linecap="round"/>
  <line x1="24" y1="40" x2="24" y2="42.5" stroke="#A7ADA8" stroke-width="1.2" stroke-linecap="round"/>

  <!-- 5. Dynamic Athletic Monogram: Kinetic F & M Interlock -->
  <!-- 'F' Column: Faceted Titanium Pillar -->
  <path d="M 12 12.5 H 25.5 L 23.5 16 H 16 V 21.5 H 22 L 20 25 H 16 V 35.5 H 12 Z" fill="url(#fmSteelGrad)"/>

  <!-- 'M' Pulse Wings: Crimson High-Performance Peak -->
  <path d="M 23 35.5 L 26.8 19 L 30 26.5 L 34.5 12.5 H 38.5 L 38.5 35.5 H 35 L 35 20 L 31.2 31.5 H 28.8 L 25.2 24 L 21 35.5 Z" fill="url(#fmCrimsonEnergy)" filter="url(#fmCoreGlow)"/>

  <!-- 6. Radiant Crimson Diamond Vertex (Heart-Rate Peak Core) -->
  <polygon points="34.5,12.5 37,9.5 34.5,6.5 32,9.5" fill="#FF453A" stroke="#FFFFFF" stroke-width="0.75"/>
  <circle cx="34.5" cy="9.5" r="1" fill="#FFFFFF"/>
</svg>