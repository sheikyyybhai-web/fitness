    // =========================================================================
    // CALCULATION LOGIC ENGINE (12 Clinical Tools)
    // =========================================================================
    const Calculations = {
      // 1. BMI with Overweight Analysis & Milestones
      bmi: (wKg, hCm) => {
        const hM = hCm / 100;
        const val = Math.round((wKg / (hM * hM)) * 10) / 10;
        let cat = 'Normal weight', color = 'text-fm-forest', bg = 'bg-fm-sage';
        if (val < 18.5) { cat = 'Underweight'; color = 'text-fm-amber'; bg = 'bg-amber-100'; }
        else if (val < 25) { cat = 'Normal weight'; color = 'text-fm-forest'; bg = 'bg-fm-sage'; }
        else if (val < 30) { cat = 'Overweight'; color = 'text-fm-amber'; bg = 'bg-amber-100'; }
        else { cat = 'Obese'; color = 'text-fm-red'; bg = 'bg-red-100'; }
        const minW = Math.round(18.5 * hM * hM * 10) / 10;
        const maxW = Math.round(24.9 * hM * hM * 10) / 10;
        const diffFromMaxW = Math.round((wKg - maxW) * 10) / 10;
        const diffFromMinW = Math.round((minW - wKg) * 10) / 10;
        const isOverweight = val >= 25.0;
        const isUnderweight = val < 18.5;
        const isNormal = val >= 18.5 && val < 25.0;
        const overweightKg = Math.max(0, diffFromMaxW);
        const underweightKg = Math.max(0, diffFromMinW);
        const weeksToHealthyWeight = Math.ceil(overweightKg / 0.5);
        return { 
          val, cat, color, bg, minW, maxW, 
          diffFromMaxW, diffFromMinW, 
          isOverweight, isUnderweight, isNormal, 
          overweightKg, underweightKg, weeksToHealthyWeight 
        };
      },

      // 2. BMR (Mifflin-St Jeor)
      bmr: (wKg, hCm, age, sex) => {
        let b = 10 * wKg + 6.25 * hCm - 5 * age + (sex === 'male' ? 5 : -161);
        return Math.round(b);
      },

      // 3. TDEE
      tdee: (bmrVal, actLevel) => {
        const mults = { sedentary: 1.2, lightly_active: 1.375, moderately_active: 1.55, very_active: 1.725, extremely_active: 1.9 };
        const mult = mults[actLevel] || 1.2;
        return Math.round(bmrVal * mult);
      },

      // 4. LBM (Boer Formula)
      lbm: (wKg, hCm, sex, bfPct) => {
        if (bfPct && bfPct > 0) {
          const lbmKg = Math.round(wKg * (1 - bfPct / 100) * 10) / 10;
          return { lbmKg, pct: Math.round((lbmKg / wKg) * 100) };
        }
        let l = sex === 'male' ? (0.407 * wKg + 0.267 * hCm - 19.2) : (0.252 * wKg + 0.473 * hCm - 48.3);
        l = Math.max(10, Math.round(l * 10) / 10);
        return { lbmKg: l, pct: Math.round((l / wKg) * 100) };
      },

      // 5. Fat Mass
      fatMass: (wKg, lbmKg) => {
        const fm = Math.max(0, Math.round((wKg - lbmKg) * 10) / 10);
        return { fmKg: fm, pct: Math.round((fm / wKg) * 100) };
      },

      // 6. Body Fat (US Navy)
            // 6. Body Fat (Deurenberg Formula - No tape measurements needed)
      bodyFatDeurenberg: (wKg, hCm, age, sex) => {
        const bmiVal = wKg / ((hCm / 100) * (hCm / 100));
        const sexFactor = sex === 'male' ? 1 : 0;
        const rawBf = (1.20 * bmiVal) + (0.23 * (age || 25)) - (10.8 * sexFactor) - 5.4;
        return Math.round(Math.max(4, Math.min(60, rawBf)) * 10) / 10;
      },

      bodyFatNavy: (sex, hCm, waistCm, neckCm, hipsCm) => {
        let bf = 15;
        try {
          if (sex === 'male') {
            const diff = Math.max(1, waistCm - neckCm);
            bf = 495 / (1.0324 - 0.19077 * Math.log10(diff) + 0.15456 * Math.log10(hCm)) - 450;
          } else {
            const sum = Math.max(1, waistCm + (hipsCm || waistCm * 1.15) - neckCm);
            bf = 495 / (1.29579 - 0.35004 * Math.log10(sum) + 0.22100 * Math.log10(hCm)) - 450;
          }
        } catch (err) { bf = 18; }
        return Math.max(4, Math.min(55, Math.round(bf * 10) / 10));
      },

      // 7. Reference Weight Range
      referenceWeight: (hCm, sex) => {
        const hM = hCm / 100;
        const minW = Math.round(18.5 * hM * hM * 10) / 10;
        const maxW = Math.round(24.9 * hM * hM * 10) / 10;
        const inOver60 = Math.max(0, (hCm / 2.54) - 60);
        const devine = Math.round((sex === 'male' ? 50 + 2.3 * inOver60 : 45.5 + 2.3 * inOver60) * 10) / 10;
        return { minW, maxW, devine };
      },

      // 8. Waist-to-Height Ratio
      whtr: (waistCm, hCm) => {
        const ratio = Math.round((waistCm / hCm) * 100) / 100;
        let cat = 'Healthy / Low risk';
        if (ratio < 0.4) cat = 'Take care (slender)';
        else if (ratio < 0.5) cat = 'Healthy / Low risk';
        else if (ratio < 0.6) cat = 'Increased risk';
        else cat = 'High cardiometabolic risk';
        return { ratio, cat };
      },

      // 9. Protein Requirement
      proteinReq: (wKg, gPerKg = 1.6) => {
        const grams = Math.round(wKg * gPerKg);
        return { grams, kcal: grams * 4 };
      },

      // 10. Fiber Requirement
      fiberReq: (age, sex, dailyCal) => {
        if (dailyCal && dailyCal > 800) {
          return Math.round((dailyCal / 1000) * 14);
        }
        return sex === 'male' ? (age <= 50 ? 38 : 30) : (age <= 50 ? 25 : 21);

        let adj = 0;
        if (goal === 'fat_loss') adj = -400;
        else if (goal === 'muscle_gain') adj = 250;
        else if (goal === 'strength') adj = 150;
        const target = Math.round(tdee + adj);
        const floor = sex === 'male' ? 1500 : 1200;
        return { target, floor, isSafe: target >= floor, adj };
      },

      // 12. Macro Planner
      macroPlanner: (cal, pPct = 30, cPct = 40, fPct = 30) => {
        const tot = pPct + cPct + fPct;
        const pG = Math.round((cal * (pPct / tot)) / 4);
        const cG = Math.round((cal * (cPct / tot)) / 4);
        const fG = Math.round((cal * (fPct / tot)) / 9);
        return { pG, cG, fG };
      }

    // INTERACTIVE FOOD RECORD & PROTEIN DATA EDITOR MODAL
    // =========================================================================
    function EditFoodModal({ food, categories, onClose, onSave }) {
      const [name, setName] = useState(food.name || '');
      const [category, setCategory] = useState(food.category || 'chicken');
      const [dietaryType, setDietaryType] = useState(food.dietaryType || 'non-vegetarian');
      const [prepState, setPrepState] = useState(food.prepState || 'cooked');
      const [servingG, setServingG] = useState(food.servingG || 100);
      const [p100g, setP100g] = useState(food.p100g != null ? food.p100g : 20.0);
      const [cal100g, setCal100g] = useState(food.cal100g != null ? food.cal100g : 150);
      const [c100g, setC100g] = useState(food.c100g != null ? food.c100g : 0);
      const [f100g, setF100g] = useState(food.f100g != null ? food.f100g : 0);
      const [fiber100g, setFiber100g] = useState(food.fiber100g != null ? food.fiber100g : 0);

      const categoryName = categories.find(c => c.id === category)?.name || 'General';

      // Computed protein metrics
      const proteinPerServing = Math.round((parseFloat(p100g || 0) * (parseFloat(servingG || 100) / 100)) * 10) / 10;
      const proteinKcal = Math.round(parseFloat(p100g || 0) * 4);
      const proteinPctOfTotal = cal100g > 0 ? Math.min(100, Math.round((proteinKcal / cal100g) * 100)) : 0;

      const handleSave = (e) => {
        e.preventDefault();
        if (!name.trim()) {
          alert('Please enter a food name.');
          return;
        }
        onSave({
          ...food,
          name: name.trim(),
          category,
          categoryName,
          dietaryType,
          prepState,
          servingG: parseFloat(servingG) || 100,
          p100g: parseFloat(p100g) || 0,
          cal100g: parseFloat(cal100g) || 0,
          c100g: parseFloat(c100g) || 0,
          f100g: parseFloat(f100g) || 0,
          fiber100g: parseFloat(fiber100g) || 0,
          updatedAt: new Date().toISOString()
        });
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-fm-card rounded-2xl max-w-xl w-full border border-fm-border shadow-fm-modal p-6 my-8 max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between border-b border-fm-border pb-3 mb-4">
              <div>
                <span className="text-[10px] font-bold uppercase tracking-wider text-fm-forest bg-fm-sage px-2 py-0.5 rounded">
                  Protein & Nutrition Data Editor
                </span>
                <h2 className="text-xl font-bold text-fm-text mt-1">Edit / Correct Food Record</h2>
                <p className="text-xs text-fm-muted">Ensure protein and macronutrient consistency across the platform</p>
              </div>
              <button onClick={onClose} className="p-1 rounded-lg hover:bg-fm-surfaceSubtle text-fm-muted">
                <Icon name="close" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSave} className="space-y-4">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-bold text-fm-text block mb-1">Food Name *</label>
                  <input
                    type="text"
                    required
                    value={name}
                    onChange={e => setName(e.target.value)}
                    className="w-full px-3 py-2 text-xs font-semibold rounded-lg border border-fm-border bg-fm-surfaceSubtle focus:bg-fm-card"
                  />
                </div>
                <div>
                  <label className="text-xs font-bold text-fm-text block mb-1">Category</label>
                  <select
                    value={category}
                    onChange={e => setCategory(e.target.value)}
                    className="w-full px-3 py-2 text-xs font-semibold rounded-lg border border-fm-border bg-fm-surfaceSubtle"
                  >
                    {categories.filter(c => c.id !== 'all').map(c => (
                      <option key={c.id} value={c.id}>{c.name}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                <div>
                  <label className="text-xs font-bold text-fm-text block mb-1">Dietary Type</label>
                  <select
                    value={dietaryType}
                    onChange={e => setDietaryType(e.target.value)}
                    className="w-full px-3 py-2 text-xs font-semibold rounded-lg border border-fm-border bg-fm-surfaceSubtle capitalize"
                  >
                    <option value="vegetarian">Vegetarian</option>
                    <option value="vegan">Vegan</option>
                    <option value="non-vegetarian">Non-Vegetarian</option>
                  </select>
                </div>
                <div>
                  <label className="text-xs font-bold text-fm-text block mb-1">Preparation State</label>
                  <select
                    value={prepState}
                    onChange={e => setPrepState(e.target.value)}
                    className="w-full px-3 py-2 text-xs font-semibold rounded-lg border border-fm-border bg-fm-surfaceSubtle capitalize"
                  >
                    <option value="cooked">Cooked</option>
                    <option value="raw">Raw</option>
                    <option value="prepared">Prepared</option>
                    <option value="packaged">Packaged</option>
                  </select>
                </div>
                <div className="col-span-2 sm:col-span-1">
                  <label className="text-xs font-bold text-fm-text block mb-1">Default Serving (g)</label>
                  <input
                    type="number"
                    step="5"
                    min="1"
                    value={servingG}
                    onChange={e => setServingG(e.target.value)}
                    className="w-full px-3 py-2 text-xs font-bold rounded-lg border border-fm-border bg-fm-surfaceSubtle"
                  />
                </div>
              </div>

              {/* CORE PROTEIN DATA HIGHLIGHT */}
              <div className="p-4 rounded-xl bg-fm-sage/50 border border-fm-forest/20 space-y-2">
                <div className="flex items-center justify-between">
                  <label className="text-xs font-extrabold text-fm-forestDark flex items-center gap-1.5">
                    <span>Protein Content (grams per 100g) *</span>
                    <span className="text-[10px] bg-fm-forest text-white px-1.5 py-0.5 rounded font-mono">Core</span>
                  </label>
                  <span className="text-xs font-extrabold text-fm-forestDark">
                    {proteinPerServing}g in {servingG}g serving
                  </span>
                </div>
                <input
                  type="number"
                  step="0.1"
                  min="0"
                  max="100"
                  required
                  value={p100g}
                  onChange={e => setP100g(e.target.value)}
                  className="w-full px-3 py-2.5 text-base font-extrabold text-fm-text rounded-lg border border-fm-forest/30 bg-fm-card focus:outline-none focus:ring-2 focus:ring-fm-forest"
                />
                <div className="flex items-center justify-between text-[11px] text-fm-muted pt-1">
                  <span>Protein Energy: <strong className="text-fm-text">{proteinKcal} kcal / 100g</strong></span>
                  <span>Density: <strong className="text-fm-forestDark font-bold">{proteinPctOfTotal}% of total calories</strong></span>
                </div>
              </div>

              {/* Other Macronutrients Grid */}
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <div>
                  <label className="text-xs font-bold text-fm-text block mb-1">Calories (100g)</label>
                  <input
                    type="number"
                    step="1"
                    min="0"
                    value={cal100g}
                    onChange={e => setCal100g(e.target.value)}
                    className="w-full px-3 py-2 text-xs font-bold rounded-lg border border-fm-border bg-fm-surfaceSubtle"
                  />
                </div>
                <div>
                  <label className="text-xs font-bold text-fm-text block mb-1">Carbs (g)</label>
                  <input
                    type="number"
                    step="0.1"
                    min="0"
                    value={c100g}
                    onChange={e => setC100g(e.target.value)}
                    className="w-full px-3 py-2 text-xs font-bold rounded-lg border border-fm-border bg-fm-surfaceSubtle"
                  />
                </div>
                <div>
                  <label className="text-xs font-bold text-fm-text block mb-1">Total Fat (g)</label>
                  <input
                    type="number"
                    step="0.1"
                    min="0"
                    value={f100g}
                    onChange={e => setF100g(e.target.value)}
                    className="w-full px-3 py-2 text-xs font-bold rounded-lg border border-fm-border bg-fm-surfaceSubtle"
                  />
                </div>
                <div>
                  <label className="text-xs font-bold text-fm-text block mb-1">Dietary Fiber (g)</label>
                  <input
                    type="number"
                    step="0.1"
                    min="0"
                    value={fiber100g}
                    onChange={e => setFiber100g(e.target.value)}
                    className="w-full px-3 py-2 text-xs font-bold rounded-lg border border-fm-border bg-fm-surfaceSubtle"
                  />
                </div>
              </div>

              <div className="flex items-center justify-end gap-2.5 pt-4 border-t border-fm-border">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 text-xs font-bold rounded-lg border border-fm-border text-fm-muted hover:bg-fm-surfaceSubtle"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 text-xs font-bold rounded-lg bg-fm-forest text-white hover:bg-fm-forestDark shadow-sm flex items-center gap-1.5"
                >
                  <Icon name="check" className="w-3.5 h-3.5" />
                  <span>Save Food Record</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Users can ONLY log in as User. Users CANNOT log in as Admin.

    function UserAuthModal({ isOpen, onClose, currentUser, onUserLogin, onLogout }) {
      if (!isOpen) return null;

      const [userName, setUserName] = useState(currentUser.displayName || 'User');
      const [userEmail, setUserEmail] = useState(currentUser.email || 'user@fitnessmetric.io');

                {/* Scaled Macronutrient Highlights */}

                          {compareList.map(f => <td key={f.id} className="p-3 capitalize">{f.dietaryType}</td>)}
                        </tr>
                      </tbody>
                    </table>

                )}

                    {testConnectionStatus.message}
                  </div>
                )}

                <div className="flex items-center justify-end gap-2 border-t border-fm-border pt-4">

                    onClick={() => {
                      if (!supabaseConfig.url || !supabaseConfig.anonKey) {

                      setSupabaseConfig(c => ({ ...c, isConfigured: Boolean(c.url && c.anonKey) }));

                      logAudit('CONFIG_SUPABASE', 'Database', 'Saved Supabase project credentials in Settings.');

                    className="px-4 py-1.5 text-xs font-bold rounded-lg bg-fm-forest text-white hover:bg-fm-forestDark"

    }

    // =========================================================================
    // VIEW 1: DASHBOARD VIEW
    // =========================================================================
    function DashboardView({ user, metrics, todayTotals, weightHistory, navigateTo, displayWeight, displayHeight, isMetric }) {
      const calPercent = Math.min(100, Math.round((todayTotals.cal / (metrics.calGoal.target || 2000)) * 100));
      const protPercent = Math.min(100, Math.round((todayTotals.protein / (metrics.protGoal.grams || 130)) * 100));

      return (
        <div className="space-y-6">
          {/* Welcome Banner */}
          <div className="bg-fm-card p-6 rounded-2xl border border-fm-border shadow-fm-card flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
            <div className="flex items-center gap-3.5">
              <div className="w-12 h-12 rounded-xl bg-red-50 border border-red-200 flex items-center justify-center flex-shrink-0 shadow-sm">
                <Icon name="logo" className="w-8 h-8" />
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-xs font-bold text-fm-forest uppercase tracking-wider">Welcome back</span>
                  <span className="text-[10px] font-extrabold bg-red-100 text-red-700 px-2 py-0.5 rounded-full border border-red-200">Fitness Metric</span>
                </div>
                <h1 className="text-2xl font-extrabold text-fm-text mt-0.5">{user.displayName}</h1>
                <p className="text-xs text-fm-muted mt-1">
                  Goal: <span className="font-semibold text-fm-text capitalize">{user.fitnessGoal.replace('_', ' ')}</span> • Activity: <span className="font-semibold text-fm-text capitalize">{user.activityLevel.replace('_', ' ')}</span>
                </p>
              </div>
            </div>
            <div className="flex flex-wrap items-center gap-2">
              <button 
                onClick={() => navigateTo('diet-planner')}
                className="px-3.5 py-2 text-xs font-extrabold rounded-lg bg-red-600 hover:bg-red-700 text-white transition-all shadow-md shadow-red-600/20 flex items-center gap-1.5"
              >
                <span>🤖</span>
                <span>AI Diet Planner</span>
              </button>
              <button 
                onClick={() => navigateTo('calculators')}
                className="px-3.5 py-2 text-xs font-bold rounded-lg border border-fm-border bg-fm-surfaceSubtle hover:bg-fm-border text-fm-text transition-smooth"
              >
                Open Calculators
              </button>
            </div>
          </div>

          {/* HIGH-VISIBILITY HOW MUCH KG OVERWEIGHT BANNER */}
          {(() => {
            const curW = parseFloat(user.currentWeightKg);
            if (!curW || curW <= 0) return null;
            const hM = (user.heightCm || 178) / 100;
            const minHealthy = Math.round(18.5 * hM * hM * 10) / 10;
            const maxHealthy = Math.round(24.9 * hM * hM * 10) / 10;
            const isOver = curW > maxHealthy;
            const isUnder = curW < minHealthy;
            const overKg = Math.round((curW - maxHealthy) * 10) / 10;
            const underKg = Math.round((minHealthy - curW) * 10) / 10;
            const overLb = Math.round(overKg * 2.20462 * 10) / 10;
            const weeksToHealthy = Math.ceil(overKg / 0.5);

            return (
              <div className={`p-4 sm:p-5 rounded-2xl border shadow-md flex flex-col md:flex-row items-start md:items-center justify-between gap-4 transition-all ${
                isOver 
                  ? 'bg-gradient-to-r from-amber-50 via-red-50 to-amber-50 border-amber-300' 
                  : isUnder 
                    ? 'bg-blue-50 border-blue-200' 
                    : 'bg-emerald-50 border-emerald-200'
              }`}>
                <div className="flex items-start gap-3.5">
                  <span className="text-3xl mt-0.5">{isOver ? '⚖️' : isUnder ? 'ℹ️' : '✅'}</span>
                  <div>
                    <div className="flex flex-wrap items-center gap-2 mb-1">
                      <span className="text-[11px] font-black uppercase tracking-wider text-fm-muted">
                        Body Weight Status Analysis
                      </span>
                      <span className={`text-[10px] font-black px-2.5 py-0.5 rounded-full uppercase shadow-sm ${
                        isOver ? 'bg-red-600 text-white' : isUnder ? 'bg-blue-600 text-white' : 'bg-emerald-700 text-white'
                      }`}>
                        {isOver ? `+${overKg} KG OVERWEIGHT` : isUnder ? `-${underKg} KG UNDERWEIGHT` : '0 KG OVER • NORMAL WEIGHT'}
                      </span>
                    </div>

                    <h3 className="text-base sm:text-lg font-black text-fm-text">
                      {isOver 
                        ? `How Much Over: +${overKg} kg (+${overLb} lbs) OVER normal weight ceiling (${maxHealthy} kg)` 
                        : isUnder 
                          ? `How Much Under: -${underKg} kg below healthy normal threshold (${minHealthy} kg)` 
                          : `Optimal Body Weight: You are in the healthy normal range (${minHealthy} kg – ${maxHealthy} kg)`}
                    </h3>

                    <p className="text-xs text-fm-muted mt-0.5 font-medium">
                      {isOver 
                        ? `Target to reach normal BMI (24.9): Lose ${overKg} kg. Estimated timeline: ~${weeksToHealthy} weeks at safe 0.5 kg/week deficit.` 
                        : `Your height of ${user.heightCm} cm has a healthy normal reference range of ${minHealthy} kg to ${maxHealthy} kg.`}
                    </p>
                  </div>
                </div>

                <div className="flex items-center gap-2 self-end md:self-auto w-full md:w-auto">
                  <button 
                    onClick={() => navigateTo('calculators')}
                    className="flex-1 md:flex-none px-3.5 py-2 text-xs font-bold rounded-lg border border-fm-border bg-white hover:bg-fm-surfaceSubtle text-fm-text transition-all shadow-sm"
                  >
                    Open Calculator ➔
                  </button>
                  {isOver && (
                    <button 
                      onClick={() => navigateTo('diet-planner')}
                      className="flex-1 md:flex-none px-4 py-2 text-xs font-extrabold rounded-lg bg-red-600 hover:bg-red-700 text-white transition-all shadow-md shadow-red-600/30 flex items-center justify-center gap-1.5"
                    >
                      <span>🤖</span>
                      <span>Plan Fat Loss</span>
                    </button>
                  )}
                </div>
              </div>
            );
          })()}

          {/* Key Metric Overview Cards */}

            <div className="bg-fm-card p-4 rounded-xl border border-fm-border shadow-fm-card">

            <div className="bg-fm-card p-4 rounded-xl border border-fm-border shadow-fm-card cursor-pointer hover:border-red-400 transition-all" onClick={() => navigateTo('calculators')}>

              <span className="text-xl font-extrabold text-fm-text mt-1 block">{metrics.bmi.val}</span>

            </div>

            <div className="bg-fm-card p-4 rounded-xl border border-fm-border shadow-fm-card">
              <span className="text-[11px] font-bold text-fm-muted block">Lean Body Mass</span>
              <span className="text-xl font-extrabold text-fm-forest mt-1 block">{displayWeight(metrics.lbm.lbmKg)}</span>
              <span className="text-[10px] text-fm-muted font-medium">{metrics.lbm.pct}% of body mass</span>
            </div>

            <div className="bg-fm-card p-4 rounded-xl border border-fm-border shadow-fm-card">
              <span className="text-[11px] font-bold text-fm-muted block">Daily Calorie Target</span>
              <span className="text-xl font-extrabold text-fm-text mt-1 block">{metrics.calGoal.target} <span className="text-xs font-normal">kcal</span></span>
              <span className="text-[10px] text-fm-muted font-medium">TDEE: {metrics.tdee} kcal</span>
            </div>

            <div className="bg-fm-card p-4 rounded-xl border border-fm-border shadow-fm-card">
              <span className="text-[11px] font-bold text-fm-muted block">Protein Target</span>
              <span className="text-xl font-extrabold text-fm-forestDark mt-1 block">{metrics.protGoal.grams} <span className="text-xs font-normal">g</span></span>
              <span className="text-[10px] text-fm-muted font-medium">Fiber: {metrics.fibGoal}g/day</span>
            </div>
          </div>

          {/* Today's Intake vs Targets & Quick Logging */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* Daily Nutrition Progress Bars */}
            <div className="lg:col-span-2 bg-fm-card p-6 rounded-2xl border border-fm-border shadow-fm-card space-y-5">
              <div className="flex items-center justify-between border-b border-fm-border pb-3">
                <div>
                  <h3 className="text-base font-bold text-fm-text">Today's Nutrition Budget</h3>
                  <p className="text-xs text-fm-muted">Logged intake against calculated targets</p>
                </div>
                <button 
                  onClick={() => navigateTo('food-log')}
                  className="text-xs font-bold text-fm-forest hover:underline"
                >
                  View Food Log →
                </button>
              </div>

              {/* Calories Progress */}
              <div>
                <div className="flex justify-between text-xs font-bold mb-1.5">
                  <span className="text-fm-text">Energy Consumption</span>
                  <span className="text-fm-muted">{todayTotals.cal} / {metrics.calGoal.target} kcal ({calPercent}%)</span>
                </div>
                <div className="w-full bg-fm-surfaceSubtle h-3 rounded-full overflow-hidden border border-fm-border">
                  <div 
                    className="bg-fm-forest h-full rounded-full transition-all duration-500" 
                    style={{ width: `${Math.min(100, calPercent)}%` }}
                  ></div>
                </div>
                <span className="text-[11px] text-fm-muted mt-1 block">

    function FoodsView({ foods, onSelectFood, onToggleCompare, compareList, onOpenCompare, categories, onEditFood, onAddNewFood }) {
      const [search, setSearch] = useState('');
      const [selectedCat, setSelectedCat] = useState('all');
      const [dietFilter, setDietFilter] = useState('all');
      const [sortBy, setSortBy] = useState('protein');

      const filtered = useMemo(() => {
        return foods.filter(f => {
          if (search) {
            const q = search.toLowerCase();
            const matchName = f.name.toLowerCase().includes(q);
            const matchCat = f.categoryName?.toLowerCase().includes(q);
            if (!matchName && !matchCat) return false;
          }
          if (selectedCat !== 'all') {
            if (selectedCat === 'vegetarian-protein') {
              if (f.dietaryType === 'non-veg' || (f.p100g || 0) < 6) return false;
            } else if (selectedCat === 'vegan-protein') {
              if (f.dietaryType !== 'vegan' || (f.p100g || 0) < 5) return false;
            } else if (selectedCat === 'protein-snacks') {
              if ((f.p100g || 0) < 8) return false;
            } else if (selectedCat === 'international-foods') {
              if (f.category === 'indian-meals') return false;
            } else if (f.category !== selectedCat) {
              return false;
            }
          }
          if (dietFilter !== 'all' && f.dietaryType !== dietFilter) return false;
          return true;
        }).sort((a, b) => {
          if (sortBy === 'protein') return b.p100g - a.p100g;
          if (sortBy === 'calories_asc') return a.cal100g - b.cal100g;
          if (sortBy === 'calories_desc') return b.cal100g - a.cal100g;
          if (sortBy === 'fiber') return b.fiber100g - a.fiber100g;
          return a.name.localeCompare(b.name);
        });
      }, [foods, search, selectedCat, dietFilter, sortBy]);

      return (
        <div className="space-y-6">

                className="px-3 py-2 text-xs font-bold rounded-lg bg-fm-forest text-white hover:bg-fm-forestDark flex items-center gap-1.5 shadow-sm transition-smooth"
                title="Add a custom food record or adjust nutrient profile"
              >
                <Icon name="plus" className="w-3.5 h-3.5" />
                <span>+ Custom Food</span>
              </button>
              {compareList.length > 0 && (
                <button 
                  onClick={onOpenCompare}
                  className="px-3.5 py-2 text-xs font-bold rounded-lg bg-fm-forestDark text-white hover:opacity-90 flex items-center gap-1.5 shadow-sm transition-smooth"
                >
                  <span>Compare ({compareList.length})</span>
                  <Icon name="chevronRight" className="w-3.5 h-3.5" />
                </button>
              )}
            </div>
          </div>

          {/* Search & Filter Controls */}
          <div className="bg-fm-card p-4 rounded-xl border border-fm-border shadow-fm-card grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
            <div className="relative">
              <input 
                type="text" 
                placeholder="Search food by name..."
                value={search}
                onChange={e => setSearch(e.target.value)}
                className="w-full pl-9 pr-3 py-2 text-xs rounded-lg border border-fm-border bg-fm-surfaceSubtle focus:bg-fm-card"
              />
              <Icon name="search" className="w-4 h-4 text-fm-muted absolute left-3 top-2.5" />
            </div>

            <div>
              <select 
                value={selectedCat} 
                onChange={e => setSelectedCat(e.target.value)}
                className="w-full px-3 py-2 text-xs rounded-lg border border-fm-border bg-fm-surfaceSubtle font-semibold"
              >
                {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </div>

            <div>
              <select 
                value={dietFilter} 
                onChange={e => setDietFilter(e.target.value)}
                className="w-full px-3 py-2 text-xs rounded-lg border border-fm-border bg-fm-surfaceSubtle font-semibold"
              >
                <option value="all">All Dietary Types</option>
                <option value="vegetarian">Vegetarian Only</option>
                <option value="vegan">Vegan Only</option>
                <option value="non-vegetarian">Non-Vegetarian Only</option>
              </select>
            </div>

            <div>
              <select 
                value={sortBy} 
                onChange={e => setSortBy(e.target.value)}
                className="w-full px-3 py-2 text-xs rounded-lg border border-fm-border bg-fm-surfaceSubtle font-semibold"
              >
                <option value="protein">Sort: Highest Protein First</option>
                <option value="calories_asc">Sort: Lowest Calories First</option>
                <option value="calories_desc">Sort: Highest Calories First</option>
                <option value="fiber">Sort: Highest Fiber First</option>
                <option value="name">Sort: Alphabetical (A-Z)</option>
              </select>
            </div>
          </div>

          {/* Foods Grid */}
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {filtered.map(food => {
              const isCompared = compareList.some(f => f.id === food.id);
              return (
                <div 
                  key={food.id}
                  className="bg-fm-card rounded-2xl border border-fm-border shadow-fm-card hover:shadow-fm-hover transition-smooth p-5 flex flex-col justify-between"
                >
                  <div>
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-[10px] font-bold uppercase tracking-wider text-fm-forest bg-fm-sage px-2 py-0.5 rounded">
                        {food.categoryName}
                      </span>
                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded border ${
                        food.dietaryType === 'vegan' ? 'bg-rose-50 text-rose-800 border-rose-200' :
                        food.dietaryType === 'vegetarian' ? 'bg-fm-sage text-fm-forestDark border-fm-forest/20' :
                        'bg-stone-100 text-stone-800 border-stone-200'
                      }`}>
                        {food.dietaryType}
                      </span>
                    </div>

                    <h3 className="font-extrabold text-base text-fm-text mb-1">{food.name}</h3>
                    <p className="text-[11px] text-fm-muted mb-4">Preparation: <strong className="capitalize text-fm-text">{food.prepState}</strong></p>

                    {/* Macro pill summary */}
                    <div className="grid grid-cols-4 gap-2 text-center bg-fm-surfaceSubtle p-2.5 rounded-xl border border-fm-border mb-4">
                      <div>
                        <span className="text-[10px] text-fm-muted font-bold block">Calories</span>
                        <span className="text-xs font-extrabold text-fm-text">{food.cal100g}</span>
                      </div>
                      <div>
                        <span className="text-[10px] text-fm-forest font-bold block">Protein</span>
                        <span className="text-xs font-extrabold text-fm-forestDark">{food.p100g}g</span>
                      </div>
                      <div>
                        <span className="text-[10px] text-fm-muted font-bold block">Carbs</span>
                        <span className="text-xs font-semibold text-fm-text">{food.c100g}g</span>
                      </div>
                      <div>
                        <span className="text-[10px] text-fm-muted font-bold block">Fat</span>
                        <span className="text-xs font-semibold text-fm-text">{food.f100g}g</span>
                      </div>
                    </div>
                  </div>

                  <div className="flex items-center gap-2 pt-2 border-t border-fm-border">
                    <button
                      onClick={() => onSelectFood(food)}
                      className="flex-1 py-1.5 text-xs font-bold rounded-lg bg-fm-forest text-white hover:bg-fm-forestDark transition-smooth text-center"
                    >
                      Nutrient Profile
                    </button>
                    <button
                      onClick={() => onEditFood && onEditFood(food)}
                      className="px-2.5 py-1.5 text-xs font-bold rounded-lg border border-fm-border text-fm-text hover:text-white hover:bg-fm-forest transition-smooth flex items-center gap-1"
                      title="Edit / Correct Nutrition Data"
                    >
                      <Icon name="edit" className="w-3.5 h-3.5" />
                      <span>Edit</span>
                    </button>
                    <button
                      onClick={() => onToggleCompare(food)}
                      className={`px-3 py-1.5 text-xs font-bold rounded-lg border transition-smooth ${
                        isCompared 
                          ? 'bg-fm-forestDark text-white border-fm-forestDark' 
                          : 'border-fm-border text-fm-muted hover:bg-fm-surfaceSubtle'
                      }`}
                    >
                      {isCompared ? '✓ Compare' : '+ Compare'}
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
                  </div>
      );
    }

    // =========================================================================
    // VIEW 4: DAILY NUTRITION TRACKER & FOOD LOG
    // =========================================================================
    function FoodLogView({ 
      foodLogs, 
      foods = [], 
      todayTotals, 
      calGoal, 
      protGoal, 
      fibGoal, 
      onDeleteLog, 
      onUpdateLog, 
      onAddQuickLog, 
      onClearMeal, 
      onClearAllToday, 
      navigateTo 
    }) {
      const meals = ['breakfast', 'lunch', 'dinner', 'snack'];
      
      // Top Text Entry State
      const [entryMeal, setEntryMeal] = useState('breakfast');
      const [entryText, setEntryText] = useState('');
      const [entryGrams, setEntryGrams] = useState(100);
      const [selectedFoodObj, setSelectedFoodObj] = useState(null);
      const [showSuggestions, setShowSuggestions] = useState(false);

      // Custom macro overrides if typing unknown food
      const [customCals, setCustomCals] = useState('');
      const [customProt, setCustomProt] = useState('');
      const [customCarbs, setCustomCarbs] = useState('');
      const [customFat, setCustomFat] = useState('');
      const [customFiber, setCustomFiber] = useState('');

      // Inline editing state for existing logs
      const [editingLogId, setEditingLogId] = useState(null);
      const [editGrams, setEditGrams] = useState(100);
      const [editFoodName, setEditFoodName] = useState('');
      const [editMealType, setEditMealType] = useState('breakfast');
      const [editBaseCals, setEditBaseCals] = useState(100);
      const [editBaseProt, setEditBaseProt] = useState(10);
      const [editBaseCarbs, setEditBaseCarbs] = useState(10);
      const [editBaseFat, setEditBaseFat] = useState(2);
      const [editBaseFiber, setEditBaseFiber] = useState(1);

      // Autocomplete search from 230+ food database
      const filteredFoodSuggestions = useMemo(() => {
        if (!entryText.trim() || entryText.length < 1) return [];
        const q = entryText.toLowerCase().trim();
        return (foods || []).filter(f => 
          (f.name || '').toLowerCase().includes(q) ||
          (f.tags || []).some(t => t.toLowerCase().includes(q))
        ).slice(0, 6);
      }, [foods, entryText]);

      // Automatically calculate macros for current text entry
      const autoCalculated = useMemo(() => {
        const grams = parseFloat(entryGrams) || 0;
        const ratio = grams / 100;

        if (selectedFoodObj) {
          return {
            cal: Math.round(selectedFoodObj.cal100g * ratio),
            protein: Math.round(selectedFoodObj.p100g * ratio * 10) / 10,
            carbs: Math.round(selectedFoodObj.c100g * ratio * 10) / 10,
            fat: Math.round(selectedFoodObj.f100g * ratio * 10) / 10,
            fiber: Math.round(selectedFoodObj.fiber100g * ratio * 10) / 10,
            isFromDb: true
          };
        }

        // Try exact name match or best substring match from foods
        const q = entryText.toLowerCase().trim();
        let match = (foods || []).find(f => (f.name || '').toLowerCase() === q);
        if (!match && q.length >= 2) {
          match = (foods || []).find(f => (f.name || '').toLowerCase().startsWith(q)) ||
                  (foods || []).find(f => (f.name || '').toLowerCase().includes(q));
        }
        if (match) {
          return {
            cal: Math.round(match.cal100g * ratio),
            protein: Math.round(match.p100g * ratio * 10) / 10,
            carbs: Math.round(match.c100g * ratio * 10) / 10,
            fat: Math.round(match.f100g * ratio * 10) / 10,
            fiber: Math.round(match.fiber100g * ratio * 10) / 10,
            matchedName: match.name,
            isFromDb: true
          };
        }

        // Custom entries
        return {
          cal: Math.round((parseFloat(customCals) || 0) * (grams / 100)),
          protein: Math.round((parseFloat(customProt) || 0) * (grams / 100) * 10) / 10,
          carbs: Math.round((parseFloat(customCarbs) || 0) * (grams / 100) * 10) / 10,
          fat: Math.round((parseFloat(customFat) || 0) * (grams / 100) * 10) / 10,
          fiber: Math.round((parseFloat(customFiber) || 0) * (grams / 100) * 10) / 10,
          isFromDb: false
        };
      }, [selectedFoodObj, entryText, entryGrams, foods, customCals, customProt, customCarbs, customFat, customFiber]);

      const handleSelectSuggestion = (food) => {
        setSelectedFoodObj(food);
        setEntryText(food.name);
        setShowSuggestions(false);
      };

      const handleAddFoodSubmit = (e) => {
        if (e) e.preventDefault();
        if (!entryText.trim()) return;

        const grams = parseFloat(entryGrams) || 100;
        const newLog = {
          id: `l-${Date.now()}`,
          mealType: entryMeal,
          foodName: entryText.trim(),
          quantityG: grams,
          cal: autoCalculated.cal,
          protein: autoCalculated.protein,
          carbs: autoCalculated.carbs,
          fat: autoCalculated.fat,
          fiber: autoCalculated.fiber,
          date: new Date().toISOString().split('T')[0]
        };

        if (onAddQuickLog) onAddQuickLog(newLog);

        // Confetti feedback
        if (typeof confetti === 'function') {
          confetti({ particleCount: 35, spread: 60, origin: { y: 0.8 }, colors: ['#DC2626', '#EF4444', '#FEE2E2'] });
        }

        // Reset text entry
        setEntryText('');
        setSelectedFoodObj(null);
        setCustomCals('');
        setCustomProt('');
        setCustomCarbs('');
        setCustomFat('');
        setCustomFiber('');
      };

      // Inline editing for existing item
      const startEditing = (log) => {
        setEditingLogId(log.id);
        setEditFoodName(log.foodName);
        setEditGrams(log.quantityG || 100);
        setEditMealType(log.mealType);
        const ratio = (log.quantityG || 100) / 100;
        setEditBaseCals(ratio > 0 ? (log.cal / ratio) : log.cal);
        setEditBaseProt(ratio > 0 ? (log.protein / ratio) : log.protein);
        setEditBaseCarbs(ratio > 0 ? (log.carbs / ratio) : log.carbs);
        setEditBaseFat(ratio > 0 ? (log.fat / ratio) : log.fat);
        setEditBaseFiber(ratio > 0 ? ((log.fiber || 0) / ratio) : (log.fiber || 0));
      };

      const handleSaveEdit = (logId) => {
        const ratio = editGrams / 100;
        const updated = {
          id: logId,
          foodName: editFoodName,
          mealType: editMealType,
          quantityG: editGrams,
          cal: Math.round(editBaseCals * ratio),
          protein: Math.round(editBaseProt * ratio * 10) / 10,
          carbs: Math.round(editBaseCarbs * ratio * 10) / 10,
          fat: Math.round(editBaseFat * ratio * 10) / 10,
          fiber: Math.round(editBaseFiber * ratio * 10) / 10,
          date: new Date().toISOString().split('T')[0]
        };
        if (onUpdateLog) onUpdateLog(updated);
        setEditingLogId(null);
      };

      // Quick delta portion adjust (+25g / -25g)
      const handleDeltaAdjust = (log, delta) => {
        const newGrams = Math.max(10, (log.quantityG || 100) + delta);
        const oldGrams = log.quantityG || 100;
        const scale = newGrams / oldGrams;
        const updated = {
          ...log,
          quantityG: newGrams,
          cal: Math.round(log.cal * scale),
          protein: Math.round(log.protein * scale * 10) / 10,
          carbs: Math.round((log.carbs || 0) * scale * 10) / 10,
          fat: Math.round((log.fat || 0) * scale * 10) / 10,
          fiber: Math.round((log.fiber || 0) * scale * 10) / 10
        };
        if (onUpdateLog) onUpdateLog(updated);
      };

      const protPercent = Math.min(100, Math.round((todayTotals.protein / (protGoal?.grams || 120)) * 100));
      const calPercent = Math.min(100, Math.round((todayTotals.cal / (calGoal?.target || 2000)) * 100));
      const fibPercent = Math.min(100, Math.round((todayTotals.fiber / (fibGoal?.grams || 30)) * 100));

      return (
        <div className="space-y-6">
          {/* Header Bar */}
          <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-3 border-b border-red-200 pb-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-red-600 animate-ping" />
                <span className="text-xs font-bold text-red-600 uppercase tracking-wider">Fast Food Entry & Macro Engine</span>
              </div>
              <h1 className="text-2xl font-extrabold text-fm-text">Daily Nutrition Tracker</h1>
              <p className="text-xs text-fm-muted">Type any food to automatically calculate Protein, Carbohydrates, Total Fat, and Dietary Fiber</p>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={() => navigateTo('foods')}
                className="px-3.5 py-2 text-xs font-bold rounded-xl border border-stone-200 bg-white text-stone-700 hover:bg-stone-50 transition-all flex items-center gap-1.5 shadow-sm"
              >
                <span>Browse 230+ Foods</span>
              </button>
              {todayTotals.logs.length > 0 && (
                <button
                  onClick={() => {
                    if (window.confirm("Clear all meals logged for today?")) {
                      if (onClearAllToday) onClearAllToday();
                    }
                  }}
                  className="px-3 py-2 text-xs font-bold rounded-xl border border-red-200 text-stone-500 hover:text-red-600 hover:bg-red-50 transition-all"
                  title="Clear today's logs"
                >
                  Clear Day
                </button>
              )}
            </div>
          </div>

          {/* STREAMLINED TEXT ENTRY FORMAT WITH AUTOMATIC MACRO CALCULATIONS */}
          <div className="bg-white rounded-2xl border-2 border-red-500/40 p-5 shadow-lg space-y-4">
            <div className="flex items-center justify-between border-b border-red-100 pb-2.5">
              <div className="flex items-center gap-2">
                <span className="p-1.5 rounded-lg bg-red-600 text-white">
                  <Icon name="plus" className="w-4 h-4" />
                </span>
                <div>
                  <h3 className="font-extrabold text-base text-fm-text">Text Entry Food Logger</h3>
                  <p className="text-[11px] text-fm-muted">Type a food name — Protein, Carbs, Total Fat & Fiber calculate automatically</p>
                </div>
              </div>
            </div>

            {/* Meal Slot Selector Pills */}
            <div className="flex flex-wrap items-center gap-2">
              <span className="text-xs font-extrabold text-fm-text mr-1">Meal:</span>
              {meals.map(m => (
                <button
                  key={m}
                  type="button"
                  onClick={() => setEntryMeal(m)}
                  className={`px-3.5 py-1.5 rounded-xl text-xs font-extrabold capitalize transition-all ${entryMeal === m ? 'bg-red-600 text-white shadow-md shadow-red-600/30' : 'bg-stone-100 text-stone-600 hover:bg-stone-200'}`}
                >
                  {m}
                </button>
              ))}
            </div>

            {/* Text Entry Input Form */}
            <form onSubmit={handleAddFoodSubmit} className="space-y-3">
              <div className="grid grid-cols-1 sm:grid-cols-12 gap-3 relative">
                {/* Food Name Search & Autocomplete */}
                <div className="sm:col-span-8 relative">
                  <label className="text-[11px] font-bold text-fm-text block mb-1">
                    Food Name (Search or Type) *
                  </label>
                  <div className="relative">
                    <input
                      type="text"
                      required
                      placeholder="e.g. Boiled Egg, Chicken Breast, Oats, Brown Rice, Paneer, Whey Protein, Apple..."
                      value={entryText}
                      onChange={e => {
                        setEntryText(e.target.value);
                        setSelectedFoodObj(null);
                        setShowSuggestions(true);
                      }}
                      onFocus={() => setShowSuggestions(true)}
                      className="w-full px-3.5 py-2.5 text-xs font-bold rounded-xl border border-red-200 bg-red-50/20 focus:bg-white focus:ring-2 focus:ring-red-500 focus:outline-none transition-all placeholder:text-stone-400"
                    />
                    {selectedFoodObj && (
                      <span className="absolute right-3 top-2.5 text-[10px] font-black uppercase px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 border border-emerald-300">
                        ✓ Verified Food
                      </span>
                    )}
                  </div>

                  {/* Autocomplete Suggestions Dropdown */}
                  {showSuggestions && filteredFoodSuggestions.length > 0 && (
                    <div className="absolute left-0 right-0 top-full mt-1 bg-white rounded-xl shadow-2xl border-2 border-red-300/80 z-50 overflow-hidden divide-y divide-stone-100 max-h-60 overflow-y-auto">
                      {filteredFoodSuggestions.map(f => (
                        <div
                          key={f.id}
                          onClick={() => handleSelectSuggestion(f)}
                          className="p-2.5 hover:bg-red-50/80 cursor-pointer flex items-center justify-between text-xs transition-colors"
                        >
                          <div>
                            <span className="font-extrabold text-fm-text block">{f.name}</span>
                            <span className="text-[10px] text-stone-500">Per 100g: {f.cal100g} kcal</span>
                          </div>
                          <div className="flex items-center gap-1.5 font-mono text-[10px]">
                            <span className="px-1.5 py-0.5 rounded bg-red-100 text-red-800 font-bold">{f.p100g}g P</span>
                            <span className="px-1.5 py-0.5 rounded bg-stone-100 text-stone-700">{f.c100g}g C</span>
                            <span className="px-1.5 py-0.5 rounded bg-stone-100 text-stone-700">{f.f100g}g F</span>
                            <span className="px-1.5 py-0.5 rounded bg-stone-100 text-stone-700">{f.fiber100g}g Fib</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Grams / Quantity Input */}
                <div className="sm:col-span-4">
                  <label className="text-[11px] font-bold text-fm-text block mb-1">
                    Portion Size (g)
                  </label>
                  <div className="flex items-center gap-1.5">
                    <input
                      type="number"
                      min="1"
                      step="1"
                      value={entryGrams}
                      onChange={e => setEntryGrams(parseFloat(e.target.value) || 0)}
                      className="w-full px-3 py-2.5 text-xs font-bold rounded-xl border border-red-200 text-center"
                    />
                    <div className="flex gap-1">
                      {[50, 100, 150, 200].map(g => (
                        <button
                          key={g}
                          type="button"
                          onClick={() => setEntryGrams(g)}
                          className={`px-2 py-1 text-[10px] font-bold rounded-lg border transition-all ${entryGrams === g ? 'bg-red-600 text-white border-red-600' : 'bg-stone-50 text-stone-600 border-stone-200 hover:bg-stone-100'}`}
                        >
                          {g}g
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
              </div>

              {/* AUTOMATICALLY CALCULATED MACROS DISPLAY BOX */}
              {(selectedFoodObj || (autoCalculated.cal > 0 || autoCalculated.protein > 0)) && (
                <div className="p-3 rounded-xl bg-gradient-to-r from-red-50 via-rose-50/60 to-stone-50 border border-red-200 space-y-1.5 animate-fadeIn">
                  <div className="flex items-center justify-between text-xs">
                    <span className="text-[10px] font-black uppercase tracking-wider text-red-900 flex items-center gap-1">
                      <span className="w-1.5 h-1.5 rounded-full bg-red-600 animate-ping" />
                      Automatically Calculated for {entryGrams}g of {entryText || 'Food'}:
                    </span>
                    {autoCalculated.protein >= 25 && (
                      <span className="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-300">
                        ✓ MPS Leucine Triggered ({autoCalculated.protein}g)
                      </span>
                    )}
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-5 gap-2 text-center font-mono">
                    <div className="p-2 rounded-lg bg-white border border-red-200 shadow-sm">
                      <span className="text-[9px] font-bold text-stone-500 uppercase block">Calories</span>
                      <span className="text-sm font-extrabold text-red-700">⚡ {autoCalculated.cal} kcal</span>
                    </div>
                    <div className="p-2 rounded-lg bg-white border border-red-200 shadow-sm">
                      <span className="text-[9px] font-bold text-red-600 uppercase block">Protein</span>
                      <span className="text-sm font-black text-red-700">🥩 {autoCalculated.protein} g</span>
                    </div>
                    <div className="p-2 rounded-lg bg-white border border-stone-200 shadow-sm">
                      <span className="text-[9px] font-bold text-stone-500 uppercase block">Carbohydrates</span>
                      <span className="text-sm font-bold text-stone-800">🌾 {autoCalculated.carbs} g</span>
                    </div>
                    <div className="p-2 rounded-lg bg-white border border-stone-200 shadow-sm">
                      <span className="text-[9px] font-bold text-stone-500 uppercase block">Total Fat</span>
                      <span className="text-sm font-bold text-stone-800">🥑 {autoCalculated.fat} g</span>
                    </div>
                    <div className="p-2 rounded-lg bg-white border border-stone-200 shadow-sm">
                      <span className="text-[9px] font-bold text-stone-500 uppercase block">Dietary Fiber</span>
                      <span className="text-sm font-bold text-stone-800">🥦 {autoCalculated.fiber} g</span>
                    </div>
                  </div>
                </div>
              )}

              {/* If user typed a custom food not in DB, allow entering per-100g base values */}
              {!selectedFoodObj && entryText.trim().length > 0 && filteredFoodSuggestions.length === 0 && (
                <div className="p-3 rounded-xl bg-stone-50 border border-stone-200 space-y-2 text-xs">
                  <span className="text-[10px] font-bold text-stone-500 block uppercase">

    function ExercisesView({ exercises, muscleGroups, selectedMuscle, onSelectMuscle, onSelectExercise, workoutSchedule, onToggleWorkout }) {
      const [viewMode, setViewMode] = useState('library'); // 'library' | 'muscle_explorer' | 'workout_planner'
      const [filterCategory, setFilterCategory] = useState('all');
      const [filterEquip, setFilterEquip] = useState('all');
      const [filterDiff, setFilterDiff] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [showHowItWorks, setShowHowItWorks] = useState(false);

      // Category breakdown counts
      const categoryCounts = useMemo(() => {
        const counts = {
          all: exercises.length,
          strength: 0,
          hypertrophy: 0,
          calisthenics: 0,
          core: 0,
          cardio_hiit: 0,
          functional: 0,
          mobility: 0
        };
        exercises.forEach(e => {
          const cat = e.category || 'strength';
          if (counts[cat] !== undefined) counts[cat]++;
        });
        return counts;
      }, [exercises]);

      const filteredExercises = useMemo(() => {
        return exercises.filter(e => {
          // Modality / Category filter
          if (filterCategory !== 'all' && (e.category || 'strength') !== filterCategory) return false;

          // Muscle anatomical filter
          if (selectedMuscle) {
            const key = selectedMuscle.replace('muscle-', '');
            const matchPrimary = e.primary === key || e.primary === selectedMuscle;
            const matchSec = (e.secondary || []).includes(key) || (e.secondary || []).includes(selectedMuscle);
            if (!matchPrimary && !matchSec) return false;
          }

          // Equipment filter
          if (filterEquip !== 'all' && e.equipment !== filterEquip) return false;

          // Difficulty filter
          if (filterDiff !== 'all' && e.difficulty !== filterDiff) return false;

          // Free text search
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase().trim();
            const matchName = (e.name || '').toLowerCase().includes(q);
            const matchPrimary = (e.primary || '').toLowerCase().includes(q);
            const matchEquip = (e.equipment || '').toLowerCase().includes(q);
            const matchCat = (e.category || '').toLowerCase().includes(q);
            if (!matchName && !matchPrimary && !matchEquip && !matchCat) return false;
          }

          return true;
        });
      }, [exercises, filterCategory, selectedMuscle, filterEquip, filterDiff, searchQuery]);

    function ProgressView({ weightHistory = [], onAddWeight, user, displayWeight }) {
      const [newWeight, setNewWeight] = useState('');
      const [newDate, setNewDate] = useState(new Date().toISOString().split('T')[0]);

      const latestWeight = weightHistory.length > 0 
        ? weightHistory[weightHistory.length - 1].weight 
        : (user?.currentWeightKg || 74.5);

      return (
        <div className="space-y-6">
          <div className="border-b border-fm-border pb-4">
            <h1 className="text-2xl font-extrabold text-fm-text">Progress Analytics & Check-ins</h1>
            <p className="text-xs text-fm-muted">Track body composition trends over multi-month milestones.</p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* Record New Check-in Form */}
            <div className="bg-fm-card p-6 rounded-2xl border border-fm-border shadow-fm-card space-y-4">
              <h3 className="text-base font-bold text-fm-text border-b border-fm-border pb-2">Record Weight Check-in</h3>
              
              <div>
                <label className="text-xs font-bold text-fm-text block mb-1">Date</label>
                <input 
                  type="date" 
                  value={newDate} 
                  onChange={e => setNewDate(e.target.value)} 
                  className="w-full px-3 py-2 text-xs rounded-lg border border-fm-border bg-fm-surfaceSubtle font-medium text-fm-text"
                />
              </div>

              <div>
                <label className="text-xs font-bold text-fm-text block mb-1">Body Weight (kg)</label>
                <input 
                  type="number" 
                  step="0.1" 
                  placeholder={latestWeight ? `e.g. ${latestWeight}` : 'e.g. 74.5'}
                  value={newWeight} 
                  onChange={e => setNewWeight(e.target.value)} 
                  className="w-full px-3 py-2 text-sm font-bold rounded-lg border border-fm-border bg-fm-surfaceSubtle text-fm-text"
                />
              </div>

              <button
                type="button"
                onClick={() => {
                  if (!newWeight || isNaN(parseFloat(newWeight))) return;
                  onAddWeight(newDate, parseFloat(newWeight));
                  setNewWeight('');
                }}
                className="w-full py-2.5 text-xs font-bold rounded-lg bg-red-600 hover:bg-red-700 text-white shadow-sm transition-all"
              >
                Log Check-in Entry
              </button>
            </div>

            {/* Historical Entries Table & Trend Chart */}
            <div className="lg:col-span-2 space-y-4">
              {/* Responsive SVG Sparkline Chart */}
              <div className="bg-fm-card p-5 rounded-2xl border border-fm-border shadow-fm-card">
                <div className="flex items-center justify-between border-b border-fm-border pb-3 mb-3">
                  <div>
                    <h3 className="text-base font-bold text-fm-text">Weight Trajectory Chart</h3>
                    <p className="text-xs text-fm-muted">Multi-month body mass progression</p>
                  </div>
                  <span className="text-xs font-bold text-red-700 bg-red-50 border border-red-200 px-2.5 py-1 rounded-full">
                    Latest: {displayWeight(latestWeight)}
                  </span>
                </div>
                
                {(() => {
                  if (weightHistory.length < 2) {
                    return (
                      <div className="py-10 px-4 text-center rounded-xl border border-dashed border-stone-200 bg-stone-50/60 space-y-2">
                        <span className="text-2xl block">⚖️</span>
                        <p className="text-xs font-bold text-fm-text">No weight trajectory graph yet</p>
                        <p className="text-[11px] text-fm-muted max-w-sm mx-auto">
                          Record at least 2 check-ins using the form on the left to plot your body weight trendline over time.
                        </p>
                      </div>
                    );
                  }
                  const weights = weightHistory.map(w => w.weight);
                  const minW = Math.min(...weights) - 1;
                  const maxW = Math.max(...weights) + 1;
                  const range = maxW - minW || 1;
                  const svgW = 500;
                  const svgH = 140;
                  const pad = 30;
                  
                  const points = weightHistory.map((w, i) => {
                    const x = pad + (i / (weightHistory.length - 1)) * (svgW - pad * 2);
                    const y = svgH - pad - ((w.weight - minW) / range) * (svgH - pad * 2);
                    return { x, y, ...w };
                  });
                  
                  const dPath = points.reduce((acc, pt, i) => `${acc} ${i === 0 ? 'M' : 'L'} ${pt.x} ${pt.y}`, '');
                  const areaPath = `${dPath} L ${points[points.length-1].x} ${svgH - pad} L ${points[0].x} ${svgH - pad} Z`;
                  
                  return (
                    <div>
                      <svg viewBox={`0 0 ${svgW} ${svgH}`} className="w-full h-40 overflow-visible">
                        <defs>
                          <linearGradient id="weightGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor="#DC2626" stopOpacity="0.25" />
                            <stop offset="100%" stopColor="#DC2626" stopOpacity="0.0" />
                          </linearGradient>
                        </defs>
                        <path d={areaPath} fill="url(#weightGrad)" />
                        <path d={dPath} fill="none" stroke="#DC2626" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
                        {points.map((pt, i) => (
                          <g key={i}>
                            <circle cx={pt.x} cy={pt.y} r="4" fill="#FFFFFF" stroke="#DC2626" strokeWidth="2.5" />
                            <text x={pt.x} y={pt.y - 8} textAnchor="middle" fontSize="9" fontWeight="bold" fill="#202522">
                              {pt.weight}
                            </text>
                            <text x={pt.x} y={svgH - 12} textAnchor="middle" fontSize="8" fill="#667069">
                              {pt.date.slice(5)}
                            </text>
                          </g>
                        ))}
                      </svg>
                    </div>
                  );
                })()}
              </div>

              {/* Log Table */}
              <div className="bg-fm-card p-6 rounded-2xl border border-fm-border shadow-fm-card">
                <h3 className="text-base font-bold text-fm-text border-b border-fm-border pb-2 mb-4">Historical Check-in Log</h3>
                {weightHistory.length === 0 ? (
                  <p className="text-xs text-fm-muted text-center py-6">No historical entries logged yet. Your recorded check-ins will appear here.</p>
                ) : (
                  <div className="space-y-2">
                    {weightHistory.slice().reverse().map((entry, idx) => (
                      <div key={idx} className="flex items-center justify-between p-3 rounded-xl bg-fm-surfaceSubtle text-xs border border-fm-border">
                        <span className="font-semibold text-fm-text">{entry.date}</span>
                        <span className="font-extrabold text-red-600 text-sm">{displayWeight(entry.weight)}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }
