                { name: "Greek Yogurt / Thick Curd", grams: 150, cal: 88, protein: 15.0, carbs: 5.4, fat: 0.6, fiber: 0 },
                { name: "Almonds, raw", grams: 20, cal: 116, protein: 4.2, carbs: 4.3, fat: 10.0, fiber: 2.5 },
                { name: "Banana, raw", grams: 100, cal: 89, protein: 1.1, carbs: 22.8, fat: 0.3, fiber: 2.6 }
              ]
            },
            {
              meal: "dinner",
              title: "Dinner • Lean Fish & Cellular Night Recovery",
              time: "08:00 PM",
              tip: "Bake salmon fillet with fresh dill, lemon juice, and a side of baked sweet potato.",
              items: [
                { name: "Salmon / White Fish Fillet", grams: 160, cal: 332, protein: 35.2, carbs: 0, fat: 20.8, fiber: 0 },
                { name: "Sweet Potato, baked", grams: 150, cal: 129, protein: 2.4, carbs: 30.0, fat: 0.2, fiber: 4.5 },
                { name: "Mixed Garden Salad", grams: 150, cal: 35, protein: 2.1, carbs: 6.8, fat: 0.4, fiber: 3.2 }
              ]
            }
          ];
        }

        // Dynamically scale portions based on target calories
        let baseTotalCal = 0;
        rawMeals.forEach(m => {
          m.items.forEach(it => { baseTotalCal += it.cal || 0; });
        });

        const calScale = baseTotalCal > 0 ? (cal / baseTotalCal) : 1.0;

        // Process meal totals with scaled items
        const processedMeals = rawMeals.map(m => {
          let c = 0, p = 0, cb = 0, f = 0, fib = 0;
          const scaledItems = m.items.map(it => {
            const scaledGrams = Math.max(10, Math.round((it.grams * calScale) / 5) * 5);
            const ratio = scaledGrams / (it.grams || 1);
            const itemCal = Math.round(it.cal * ratio);
            const itemP = Math.round(it.protein * ratio * 10) / 10;
            const itemCb = Math.round(it.carbs * ratio * 10) / 10;
            const itemF = Math.round(it.fat * ratio * 10) / 10;
            const itemFib = Math.round((it.fiber || 0) * ratio * 10) / 10;

            c += itemCal;
            p += itemP;
            cb += itemCb;
            f += itemF;
            fib += itemFib;

            return {
              name: it.name,
              grams: scaledGrams,
              cal: itemCal,
              protein: itemP,
              carbs: itemCb,
              fat: itemF,
              fiber: itemFib
            };
          });

          const mealP = Math.round(p * 10) / 10;
          return {
            ...m,
            items: scaledItems,
            totals: {
              cal: Math.round(c),
              protein: mealP,
              carbs: Math.round(cb * 10) / 10,
              fat: Math.round(f * 10) / 10,
              fiber: Math.round(fib * 10) / 10
            },
            isMpsTriggered: mealP >= 25.0
          };
        });

        let totCal = 0, totP = 0, totC = 0, totF = 0, totFib = 0;
        processedMeals.forEach(m => {
          totCal += m.totals.cal;
          totP += m.totals.protein;
          totC += m.totals.carbs;
          totF += m.totals.fat;
          totFib += m.totals.fiber;
        });

        return {
          goalTitle,
          deficitLabel,
          targetCal: cal,
          targetP,
          targetCarbs,
          targetFat,
          weightAnalyzed: effWeight,
          bmi: effBmi,
          isOverweight: effIsOverweight,
          overweightKg: effOverweightKg,
          overweightLb: effOverweightLb,
          weeksToHealthy: effWeeksToHealthy,
          bmr: effBmr,
          tdee: effTdee,
          healthyCeilingKg: effHealthyCeiling,
          totals: {
            cal: Math.round(totCal),
            protein: Math.round(totP * 10) / 10,
            carbs: Math.round(totC * 10) / 10,
            fat: Math.round(totF * 10) / 10,
            fiber: Math.round(totFib * 10) / 10
          },
          meals: processedMeals
        };
      };

      // Initial chat state - clean welcome without default data or meal plan
      const cleanGreeting = "👋 Enter your body weight (e.g. **80 kg**, **85**, or **90 kg vegetarian**) to get your customized diet plan.";

      const [messages, setMessages] = useState([
        {
          id: "welcome-msg",
          sender: "ai",
          text: cleanGreeting,
          plan: null,
          timestamp: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
        }
      ]);

      const [inputQuery, setInputQuery] = useState("");
      const [isTyping, setIsTyping] = useState(false);
      const [loggedNoticeId, setLoggedNoticeId] = useState(null);
      const [copiedNoticeId, setCopiedNoticeId] = useState(null);
      const [savedWeightNoticeId, setSavedWeightNoticeId] = useState(null);
      const messagesEndRef = useRef(null);

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      };

      useEffect(() => {
        scrollToBottom();
      }, [messages, isTyping]);

      // Smart Natural Language Chat Dispatcher with Instant Weight Detection
      const handleSendMessage = (textToSend = null) => {
        const query = (textToSend || inputQuery).trim();
        if (!query) return;

        const userMsg = {
          id: "user-" + Date.now(),
          sender: "user",
          text: query,
          timestamp: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
        };

        setMessages(prev => [...prev, userMsg]);
        if (!textToSend) setInputQuery("");
        setIsTyping(true);

        setTimeout(() => {
          const lower = query.toLowerCase();

          // 1. DETECT WEIGHT
          const detectedWeightObj = detectWeightFromQuery(query);
          const activeWeight = detectedWeightObj ? detectedWeightObj.val : userWeight;

          // 2. DETECT GOAL INTENT
          let detectedGoal = "fat_loss";
          if (lower.includes("bulk") || lower.includes("muscle") || lower.includes("hypertrophy") || lower.includes("gain")) {
            detectedGoal = "muscle_gain";
          } else if (lower.includes("rapid") || lower.includes("aggressive")) {
            detectedGoal = "rapid_cut";
          } else if (lower.includes("recomp")) {
            detectedGoal = "recomp";
          } else if (lower.includes("maintain") || lower.includes("maintenance")) {
            detectedGoal = "maintenance";
          }

          // 3. DETECT DIET PREFERENCE
          let detectedDiet = "high_protein";
          if (lower.includes("indian") || lower.includes("desi") || lower.includes("paneer") || lower.includes("vegetarian") || lower.includes("veg")) {
            if (!lower.includes("vegan")) detectedDiet = "indian_veg";
          }
          if (lower.includes("vegan") || lower.includes("plant")) {
            detectedDiet = "vegan";
          } else if (lower.includes("keto") || lower.includes("low carb")) {
            detectedDiet = "low_carb";
          } else if (lower.includes("mediterranean") || lower.includes("fish")) {
            detectedDiet = "mediterranean";
          }

          // 4. DETECT CUSTOM CALORIES OR PROTEIN
          const calMatch = lower.match(/(\d{4})\s*(?:kcal|cal|calories)?/);
          const customCal = calMatch ? parseInt(calMatch[1]) : null;

          const protMatch = lower.match(/(\d{2,3})\s*g(?:rams)?\s*protein/);
          const customProt = protMatch ? parseInt(protMatch[1]) : null;

          // Generate plan using activeWeight!
          const newPlan = createDietPlanData(detectedGoal, detectedDiet, customCal, customProt, Math.floor(Math.random() * 10), activeWeight);

          // Concise, direct response without unwanted clutter
          let responseText = "";

          if (detectedWeightObj) {
            responseText = `🎯 **Diet Plan for ${activeWeight} kg**\n`;
            if (newPlan.isOverweight) {
              responseText += `• Status: **+${newPlan.overweightKg} kg Overweight** (Target: ${newPlan.healthyCeilingKg} kg • ~${newPlan.weeksToHealthy} wks)\n`;
            } else if (newPlan.bmi < 18.5) {
              responseText += `• Status: **Underweight**\n`;
            } else {
              responseText += `• Status: **Healthy Normal Weight** (BMI ${newPlan.bmi})\n`;
            }
            responseText += `• Target: **${newPlan.targetCal} kcal/day** (${newPlan.deficitLabel}) | Protein: **${newPlan.targetP}g**`;
          } else {
            responseText = `🎯 **${newPlan.goalTitle}**\n• Target: **${newPlan.targetCal} kcal/day** (${newPlan.deficitLabel}) | Protein: **${newPlan.targetP}g**`;
          }

          const aiMsg = {
            id: "ai-" + Date.now(),
            sender: "ai",
            text: responseText,
            plan: newPlan,
            analyzedWeight: activeWeight,
            timestamp: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
          };

          setIsTyping(false);
          setMessages(prev => [...prev, aiMsg]);
        }, 700);
      };

      // Action: Log complete plan into Daily Food Tracker
      const handleLogPlanToTracker = (planData, msgId) => {
        const todayStr = new Date().toISOString().split("T")[0];
        const newLogs = [];

        planData.meals.forEach(m => {
          m.items.forEach((it, idx) => {
            newLogs.push({
              id: "ai-chat-log-" + Date.now() + "-" + Math.random().toString(36).substr(2, 6),
              foodId: "food-ai-" + idx,
              foodName: it.name,
              category: "ai_curated",
              meal: m.meal,
              servingG: it.grams,
              cal: it.cal,
              protein: it.protein,
              carbs: it.carbs,
              fat: it.fat,
              fiber: it.fiber,
              date: todayStr,
              timestamp: new Date().toISOString(),
              source: "FitMetric AI ChatGPT Nutritionist"
            });
          });
        });

        onAddBatchLogs(newLogs);
        setLoggedNoticeId(msgId);
        setTimeout(() => setLoggedNoticeId(null), 4000);
      };

      // Action: Copy plan to clipboard
      const handleCopyPlan = (planData, msgId) => {
        let txt = `=================================================\n`;
        txt += `FITMETRIC AI CLINICAL DIET PLAN (ChatGPT Engine)\n`;
        txt += `Calibrated Body Weight: ${planData.weightAnalyzed || userWeight} kg\n`;
        txt += `Goal: ${planData.goalTitle} (${planData.deficitLabel})\n`;
        txt += `Daily Energy: ${planData.totals.cal} kcal (Target: ${planData.targetCal})\n`;
        txt += `Macros: Protein: ${planData.totals.protein}g | Carbs: ${planData.totals.carbs}g | Fat: ${planData.totals.fat}g | Fiber: ${planData.totals.fiber}g\n`;
        txt += `=================================================\n\n`;

        planData.meals.forEach(m => {
          txt += `[${m.title}] (${m.time})\n`;
          m.items.forEach(it => {
            txt += ` • ${it.name}: ${it.grams}g -> ${it.cal} kcal | P: ${it.protein}g | C: ${it.carbs}g | F: ${it.fat}g\n`;
          });
          txt += ` Subtotal: ${m.totals.cal} kcal | Protein: ${m.totals.protein}g | Carbs: ${m.totals.carbs}g | Fat: ${m.totals.fat}g\n`;
          txt += ` Preparation Tip: ${m.tip}\n\n`;
        });

        txt += `=================================================\n`;
        txt += `Generated by FitMetric AI Clinical Nutrition Platform\n`;

        navigator.clipboard.writeText(txt).then(() => {
          setCopiedNoticeId(msgId);
          setTimeout(() => setCopiedNoticeId(null), 2500);
        });
      };

      return (
        <div className="max-w-4xl mx-auto space-y-4">
          {/* ChatGPT-style Header Bar */}
          <div className="bg-fm-card p-4 rounded-2xl border border-fm-border shadow-sm flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-red-600 to-amber-500 flex items-center justify-center text-white text-lg shadow-md relative">
                <span>🤖</span>
                <span className="w-3 h-3 rounded-full bg-emerald-500 border-2 border-white absolute bottom-0 right-0"></span>
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-base font-extrabold text-fm-text">FitMetric AI Nutritionist</h1>
                  <span className="text-[10px] font-extrabold bg-red-100 text-red-700 px-2 py-0.5 rounded-full border border-red-200">
                    Weight-To-Diet Engine
                  </span>
                </div>
                <p className="text-xs text-fm-muted">
                  Personalized nutrition by body weight
                </p>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button 
                type="button"
                onClick={() => setMessages([{
                  id: "welcome-msg",
                  sender: "ai",
                  text: cleanGreeting,
                  plan: null,
                  timestamp: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
                }])}
                className="px-3 py-1.5 text-xs font-semibold rounded-lg border border-fm-border text-fm-muted hover:bg-fm-surfaceSubtle transition-all"
                title="Reset conversation"
              >
                Reset Chat
              </button>
            </div>
          </div>

          {/* Chat Message Scrollable Container */}
          <div className="bg-fm-surfaceSubtle rounded-2xl border border-fm-border p-4 md:p-6 min-h-[500px] max-h-[640px] overflow-y-auto space-y-5">
            {messages.map(msg => (
              <div 
                key={msg.id}
                className={`flex gap-3 ${msg.sender === "user" ? "justify-end" : "justify-start"}`}
              >
                {/* AI Avatar */}
                {msg.sender === "ai" && (
                  <div className="w-8 h-8 rounded-full bg-red-600 text-white flex-shrink-0 flex items-center justify-center text-sm shadow-sm">
                    🤖
                  </div>
                )}

                {/* Message Bubble */}
                <div className={`max-w-[88%] md:max-w-[82%] space-y-3 ${
                  msg.sender === "user" 
                    ? "bg-gradient-to-r from-red-600 to-red-700 text-white p-4 rounded-2xl rounded-tr-sm shadow-md" 
                    : "bg-fm-card p-5 rounded-2xl rounded-tl-sm border border-fm-border shadow-fm-card text-fm-text"
                }`}>
                  {/* Timestamp & Sender */}
                  <div className="flex items-center justify-between text-[11px] font-semibold opacity-75 border-b pb-1.5 mb-2 border-current/10">
                    <span>{msg.sender === "user" ? "You" : "FitMetric AI Dietitian"}</span>
                    <span>{msg.timestamp}</span>
                  </div>

                  {/* Text Content */}
                  <div className="text-xs sm:text-sm leading-relaxed whitespace-pre-line font-medium">
                    {msg.text}
                  </div>

                  {/* If message includes Structured Meal Plan Data */}
                  {msg.plan && (
                    <div className="pt-3 space-y-3 border-t border-fm-border">
                      {/* Macro Summary Header Strip */}
                      <div className="p-3 rounded-xl bg-fm-surfaceSubtle border border-fm-border">
                        <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
                          <span className="text-xs font-extrabold text-fm-text">
                            {msg.plan.goalTitle} {msg.analyzedWeight ? `(${msg.analyzedWeight} kg)` : ""}
                          </span>
                          <span className="text-[10px] font-bold text-red-600 bg-red-50 px-2 py-0.5 rounded-full border border-red-200">
                            {msg.plan.deficitLabel}
                          </span>
                        </div>
                        <div className="grid grid-cols-2 sm:grid-cols-5 gap-2 text-center text-xs">
                          <div className="p-1.5 rounded bg-white border border-fm-border">
                            <span className="text-[10px] font-bold text-fm-muted block">Energy</span>
                            <span className="font-extrabold text-fm-text">{msg.plan.totals.cal} kcal</span>
                          </div>
                          <div className="p-1.5 rounded bg-red-50 border border-red-200 text-red-700">
                            <span className="text-[10px] font-bold block">Protein</span>
                            <span className="font-extrabold">{msg.plan.totals.protein} g</span>
                          </div>
                          <div className="p-1.5 rounded bg-white border border-fm-border">
                            <span className="text-[10px] font-bold text-fm-muted block">Carbs</span>
                            <span className="font-extrabold text-fm-text">{msg.plan.totals.carbs} g</span>
                          </div>
                          <div className="p-1.5 rounded bg-white border border-fm-border">
                            <span className="text-[10px] font-bold text-fm-muted block">Fat</span>
                            <span className="font-extrabold text-fm-text">{msg.plan.totals.fat} g</span>
                          </div>
                          <div className="col-span-2 sm:col-span-1 p-1.5 rounded bg-white border border-fm-border">
                            <span className="text-[10px] font-bold text-fm-muted block">Fiber</span>
                            <span className="font-extrabold text-fm-forestDark">{msg.plan.totals.fiber} g</span>
                          </div>
                        </div>
                      </div>

                      {/* Meal by Meal Cards */}
                      <div className="space-y-2.5">
                        {msg.plan.meals.map((m, mIdx) => (
                          <div key={mIdx} className="p-3.5 rounded-xl border border-fm-border bg-white space-y-2">
                            <div className="flex items-center justify-between border-b border-fm-border pb-1.5">
                              <div>
                                <h4 className="font-extrabold text-xs text-fm-text">{m.title}</h4>
                                <span className="text-[10px] text-fm-muted">{m.time}</span>
                              </div>
                              <div className="flex items-center gap-1.5">
                                {m.isMpsTriggered ? (
                                  <span className="text-[9px] font-extrabold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-300">
                                    ⚡ MPS Activated
                                  </span>
                                ) : (
                                  <span className="text-[9px] font-semibold px-2 py-0.5 rounded-full bg-stone-100 text-stone-700">
                                    {m.totals.protein}g Protein
                                  </span>
                                )}
                                <span className="text-[11px] font-bold text-fm-text bg-fm-surfaceSubtle px-2 py-0.5 rounded border border-fm-border">
                                  {m.totals.cal} kcal
                                </span>
                              </div>
                            </div>

                            {/* Food Items */}
                            <div className="space-y-1">
                              {m.items.map((it, itIdx) => (
                                <div key={itIdx} className="flex items-center justify-between text-xs py-1 px-1.5 rounded hover:bg-stone-50">
                                  <span className="font-medium text-fm-text">
                                    • {it.name} <span className="text-fm-muted font-normal">({it.grams}g)</span>
                                  </span>
                                  <span className="font-mono text-[10px] text-fm-muted">
                                    {it.cal} kcal | P:{it.protein}g C:{it.carbs}g F:{it.fat}g
                                  </span>
                                </div>
                              ))}
                            </div>

                            {/* Chef tip */}
                            <p className="text-[11px] text-fm-muted italic border-t border-dashed border-stone-200 pt-1.5">
                              Tip: {m.tip}
                            </p>
                          </div>
                        ))}
                      </div>

                      {/* Action Bar inside Message */}
                      <div className="pt-2 flex flex-wrap items-center gap-2">
                        <button
                          type="button"
                          onClick={() => handleLogPlanToTracker(msg.plan, msg.id)}
                          className="px-4 py-2 text-xs font-extrabold rounded-lg bg-red-600 hover:bg-red-700 text-white transition-all shadow-md shadow-red-600/20 flex items-center gap-1.5"
                        >
                          <span>🚀</span>
                          <span>{loggedNoticeId === msg.id ? "Logged to Today's Tracker!" : "Log Plan to Food Tracker"}</span>
                        </button>

                        <button
                          type="button"
                          onClick={() => handleCopyPlan(msg.plan, msg.id)}
                          className="px-3 py-2 text-xs font-bold rounded-lg border border-fm-border bg-fm-surfaceSubtle hover:bg-fm-border text-fm-text transition-all flex items-center gap-1.5"
                        >
                          <span>📋</span>
                          <span>{copiedNoticeId === msg.id ? "Copied!" : "Copy Plan"}</span>
                        </button>

                        {/* Button to save detected weight into profile */}
                        {onUpdateUser && msg.analyzedWeight && Math.abs(msg.analyzedWeight - (user.currentWeightKg || 74.5)) > 0.1 && (
                          <button
                            type="button"
                            onClick={() => {
                              onUpdateUser({ currentWeightKg: msg.analyzedWeight });
                              setSavedWeightNoticeId(msg.id);
                              setTimeout(() => setSavedWeightNoticeId(null), 3000);
                            }}
                            className="px-3 py-2 text-xs font-bold rounded-lg border border-amber-300 bg-amber-50 hover:bg-amber-100 text-amber-900 transition-all flex items-center gap-1.5 shadow-sm"
                            title="Update active profile weight to sync all 12 calculators and dashboard"
                          >
                            <span>💾</span>
                            <span>{savedWeightNoticeId === msg.id ? `✓ Saved ${msg.analyzedWeight} kg to Profile!` : `Set ${msg.analyzedWeight} kg as Profile Weight`}</span>
                          </button>
                        )}

                        {loggedNoticeId === msg.id && (
                          <button
                            type="button"
                            onClick={() => navigateTo("food-log")}
                            className="px-3 py-2 text-xs font-bold rounded-lg bg-fm-forest text-white hover:bg-fm-forestDark transition-all"
                          >
                            Open Daily Tracker ➔
                          </button>
                        )}
                      </div>
                    </div>
                  )}
                </div>

                {/* User Avatar */}
                {msg.sender === "user" && (
                  <div className="w-8 h-8 rounded-full bg-stone-800 text-white flex-shrink-0 flex items-center justify-center text-xs font-extrabold shadow-sm">
                    U
                  </div>
                )}
              </div>
            ))}

            {/* Typing Indicator */}
            {isTyping && (
              <div className="flex gap-3 justify-start items-center animate-fade-in">
                <div className="w-8 h-8 rounded-full bg-red-600 text-white flex items-center justify-center text-sm shadow-sm">
                  🤖
                </div>
                <div className="bg-fm-card px-4 py-3 rounded-2xl rounded-tl-sm border border-fm-border text-xs text-fm-muted flex items-center gap-2">
                  <div className="flex gap-1">
                    <span className="w-2 h-2 rounded-full bg-red-600 animate-bounce"></span>
                    <span className="w-2 h-2 rounded-full bg-red-600 animate-bounce [animation-delay:0.2s]"></span>
                    <span className="w-2 h-2 rounded-full bg-red-600 animate-bounce [animation-delay:0.4s]"></span>
                  </div>
                  <span className="font-semibold text-fm-text">FitMetric AI is formulating your meal plan...</span>
                </div>
              </div>
            )}
            <div ref={messagesEndRef} />
          </div>

          {/* Quick Weight Prompt Chips */}
          <div className="flex overflow-x-auto gap-2 pb-1 text-xs">
            {[
              { label: "85 kg Plan", prompt: "85 kg" },
              { label: "90 kg Plan", prompt: "90 kg" },
              { label: "80 kg Vegetarian", prompt: "80 kg vegetarian" },
              { label: "75 kg High Protein", prompt: "75 kg high protein" },
              { label: "70 kg Vegan", prompt: "70 kg vegan" }
            ].map((chip, idx) => (
              <button
                key={idx}
                type="button"
                onClick={() => handleSendMessage(chip.prompt)}
                className="whitespace-nowrap px-3 py-1.5 rounded-full bg-fm-card hover:bg-red-50 border border-fm-border hover:border-red-300 text-fm-text hover:text-red-700 text-[11px] font-bold transition-all shadow-sm"
              >
                {chip.label}
              </button>
            ))}
          </div>

          {/* ChatGPT Bottom Input Box */}
          <div className="bg-fm-card p-3 rounded-2xl border border-fm-border shadow-lg flex items-center gap-2">
            <span className="text-lg pl-2 text-fm-muted">💬</span>
            <input 
              type="text"
              value={inputQuery}
              onChange={e => setInputQuery(e.target.value)}
              onKeyDown={e => {
                if (e.key === "Enter") {
                  e.preventDefault();
                  handleSendMessage();
                }
              }}
              placeholder="Type your weight (e.g. 80 kg, 85, 90 kg veg)..."
              className="flex-1 px-3 py-2.5 text-xs sm:text-sm font-medium bg-transparent border-none focus:outline-none text-fm-text"
            />
            <button
              type="button"
              disabled={!inputQuery.trim()}
              onClick={() => handleSendMessage()}
              className={`w-9 h-9 rounded-xl flex items-center justify-center font-bold text-sm transition-all ${
                inputQuery.trim() 
                  ? "bg-red-600 hover:bg-red-700 text-white shadow-md shadow-red-600/30 cursor-pointer" 
                  : "bg-stone-200 text-stone-400 cursor-not-allowed"
              }`}
            >
              ↑
            </button>
          </div>
        </div>
      );
    }

    function SettingsView({ user, onUpdateUser, supabaseConfig, onSaveSupabase, unitSystem, onSetUnitSystem }) {
      const [url, setUrl] = useState(supabaseConfig.url || '');
      const [key, setKey] = useState(supabaseConfig.anonKey || '');
      const [saved, setSaved] = useState(false);

      return (
        <div className="max-w-2xl space-y-6">
          <div className="border-b border-fm-border pb-4">
            <h1 className="text-2xl font-extrabold text-fm-text">Platform Settings & Database</h1>
            <p className="text-xs text-fm-muted">Manage measurement units, account details, and Supabase PostgreSQL integration.</p>
          </div>

          {/* Unit System */}
          <div className="bg-fm-card p-6 rounded-2xl border border-fm-border shadow-fm-card space-y-3">
            <h3 className="text-base font-bold text-fm-text">Measurement System</h3>
            <div className="flex gap-3">
              <label className="flex items-center gap-2 text-xs font-semibold cursor-pointer">
                <input 
                  type="radio" 
                  name="unitSystem" 
                  checked={unitSystem === 'metric'} 
                  onChange={() => onSetUnitSystem('metric')} 
                  className="accent-fm-forest"
                />
                <span>Metric (Kilograms & Centimeters)</span>
              </label>
              <label className="flex items-center gap-2 text-xs font-semibold cursor-pointer">
                <input 
                  type="radio" 
                  name="unitSystem" 
                  checked={unitSystem === 'imperial'} 
                  onChange={() => onSetUnitSystem('imperial')} 
                  className="accent-fm-forest"
                />
                <span>Imperial (Pounds & Inches)</span>
              </label>
            </div>
          </div>

          {/* Supabase Connection */}
          <div className="bg-fm-card p-6 rounded-2xl border border-fm-border shadow-fm-card space-y-4">
            <h3 className="text-base font-bold text-fm-text">Supabase Cloud Credentials</h3>
            <div>
              <label className="text-xs font-bold text-fm-text block mb-1">Project URL</label>
              <input 
                type="text" 
                value={url} 
                onChange={e => setUrl(e.target.value)}
                placeholder="https://xyz.supabase.co"
                className="w-full px-3 py-2 text-xs rounded-lg border border-fm-border bg-fm-surfaceSubtle font-mono"
              />
            </div>
            <div>
              <label className="text-xs font-bold text-fm-text block mb-1">Anonymous Key</label>
              <input 
                type="password" 
                value={key} 
                onChange={e => setKey(e.target.value)}
                placeholder="eyJhbGciOiJIUzI1NiIsInR5..."
                className="w-full px-3 py-2 text-xs rounded-lg border border-fm-border bg-fm-surfaceSubtle font-mono"
              />
            </div>
            <button
              onClick={() => {
                onSaveSupabase(url, key);
                setSaved(true);
                setTimeout(() => setSaved(false), 2000);
              }}
              className="px-4 py-2 text-xs font-bold rounded-lg bg-fm-forest text-white hover:bg-fm-forestDark"
            >
              {saved ? 'Saved!' : 'Save Supabase Credentials'}
            </button>
          </div>

          {/* Reset All Local Data */}
          <div className="bg-fm-card p-6 rounded-2xl border border-red-200 shadow-fm-card space-y-3">
            <h3 className="text-base font-bold text-red-600">Reset Local Storage & Clear All Data</h3>
            <p className="text-xs text-fm-muted">
              Instantly wipe all locally stored food logs, weight entries, custom schedules, and calculator history. Restores the application to an absolute fresh clean state.
            </p>
            <button
              onClick={() => {
                if (window.confirm('Are you sure you want to clear all locally stored data and reset to a clean slate?')) {
                  localStorage.clear();
                  localStorage.setItem('fm_mock_cleared_v3', 'true');
                  window.location.reload();
                }
              }}
              className="px-4 py-2.5 text-xs font-bold rounded-lg bg-red-600 hover:bg-red-700 text-white transition-all shadow-sm"
            >
              Reset Application to Fresh Clean State
            </button>
          </div>

          {/* Administrator Gateway Access */}
          <div className="pt-6 border-t border-fm-border text-center">
            <a
              href="#/admin-login"
              className="inline-flex items-center gap-1.5 text-xs font-semibold text-stone-400 hover:text-red-600 transition-colors"
            >
              <span>🔒</span>
              <span>Administrator Gateway</span>
            </a>
          </div>
        </div>
      );
    }

    // Mount Root Component
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FitnessMetricApp />);
  </script>
</body>
</html>
